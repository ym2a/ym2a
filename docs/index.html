<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Validation ELY LOOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : bandeau ardoise + jaune sécurité (comme le planning papier), bloc « Qui es-tu ? », frise horaire de la journée, une carte par intervention avec UN seul bouton = la prochaine étape */
:root{
  --bg:#eceeed; --surface:#ffffff; --raise:#f5f6f5; --ink:#1c2120; --muted:#5e6463; --line:#d4d8d6;
  --slate:#005a2b; --slate-ink:#f1f7f2; --safety:#8fbf84; --safety-ink:#0f2a17;
  --act:#007a33; --act-ink:#ffffff; --steel:#878787; --steel-dark:#4a4d50; --plate:#ffffff;
  --ok:#17824a; --ok-bg:#dff2e6; --warn:#9a5b00; --warn-bg:#fdefd3; --bad:#c42b2f; --bad-bg:#fbe2e2; --idle-bg:#e9edf1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a201d; --raise:#212824; --ink:#e9eeeb; --muted:#9ca6a1; --line:#2c3530;
  --slate:#0d3a20; --slate-ink:#eef6f0; --safety:#8fbf84; --safety-ink:#0f2a17;
  --act:#4fbf78; --act-ink:#08170e; --steel:#a3a3a3; --steel-dark:#c9cccd; --plate:#f4f5f4;
  --ok:#5bd08d; --ok-bg:#15301f; --warn:#f2b24c; --warn-bg:#352812; --bad:#ff7d80; --bad-bg:#3a191b; --idle-bg:#232c35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a201d; --raise:#212824; --ink:#e9eeeb; --muted:#9ca6a1; --line:#2c3530;
  --slate:#0d3a20; --slate-ink:#eef6f0; --safety:#8fbf84; --safety-ink:#0f2a17;
  --act:#4fbf78; --act-ink:#08170e; --steel:#a3a3a3; --steel-dark:#c9cccd; --plate:#f4f5f4;
  --ok:#5bd08d; --ok-bg:#15301f; --warn:#f2b24c; --warn-bg:#352812; --bad:#ff7d80; --bad-bg:#3a191b; --idle-bg:#232c35; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--plate)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

/* ---------- En-tête ---------- */
.brand{background:var(--plate);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;border-bottom:1px solid #e3e6e4}
.brand img{height:52px;width:auto;display:block}
.brand span{margin-left:auto;font-family:Montserrat,var(--body);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#4a4d50;text-align:right;line-height:1.3}
header{background:var(--slate);color:var(--slate-ink);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px)) 16px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(90deg,#77a46f 0 33.3%,#878787 33.3% 66.6%,#007a33 66.6%)}
.top{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.8}
.top .dot{width:6px;height:6px;border-radius:50%;background:var(--safety)}
.hero{display:flex;align-items:center;gap:16px;margin-top:10px}
.hero h1{font-family:Montserrat,var(--display);font-weight:800;font-size:28px;line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.hero h1 em{display:block;font-style:normal;color:var(--safety);font-size:20px;letter-spacing:.04em;margin-top:4px}
.ring{margin-left:auto;flex:none;position:relative;width:84px;height:84px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi.done{background:color-mix(in srgb,var(--safety) 30%,transparent)}
.kpi span{display:block;line-height:1.2}
@media (max-width:360px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{border:0;font:inherit;color:inherit;text-align:left;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;cursor:pointer}
.kpi b{display:block;font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;opacity:.8}
.kpi.hot{background:var(--bad);color:#fff}
.kpi.hot span{opacity:1}
.kpi[aria-pressed="true"]{outline:2px solid var(--safety);outline-offset:-2px}

/* ---------- Qui es-tu ---------- */
.me{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.me h2{margin:0;font-family:Montserrat,var(--display);font-size:20px;letter-spacing:.02em}
.me p{margin:0;color:var(--muted);font-size:14px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.teams{display:grid;gap:8px}
.tbtn{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:var(--ink);background:var(--raise);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.tbtn .sw{width:14px;align-self:stretch;min-height:34px;border-radius:4px;flex:none}
.tbtn b{display:block;font-size:15px}
.tbtn small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.tbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--ink)}
.go-btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:13px;background:var(--act);color:var(--act-ink);cursor:pointer}
.hello{margin-top:22px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.hello .sw{width:10px;height:36px;border-radius:3px;flex:none}
.hello div{min-width:0;flex:1}
.hello b{display:block}
.hello{align-items:flex-start}
.hello .sw{height:auto;align-self:stretch}
.mem{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mem span{font-size:13px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.mem span.me-chip{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-weight:700}
.tbtn .nm{display:block;font-size:12.5px;color:var(--ink);opacity:.85;line-height:1.35;margin-top:2px}
.link{border:0;background:none;color:var(--act);font:inherit;font-size:14px;font-weight:600;padding:6px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Barre de vue ---------- */
.search{position:relative;margin-top:8px}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input:focus{border-color:var(--act);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--act) 20%,transparent)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:16px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--idle-bg);color:var(--ink);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.qinfo{font-size:13px;color:var(--muted);margin-top:6px}
.qinfo b{color:var(--ink)}
mark{background:color-mix(in srgb,var(--act) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.segbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--idle-bg);border-radius:12px;padding:4px}
.seg button{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:9px;padding:10px 6px;line-height:1.2;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--act);color:var(--act-ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button small{display:block;font-size:12px;font-weight:500;opacity:.85}
.sync{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- Frise horaire ---------- */
.hour{display:grid;grid-template-columns:48px 1fr;gap:10px;margin-top:18px}
.hour .t{position:relative;font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);text-align:right;padding-top:6px}
.hour .t::after{content:"";position:absolute;right:-6px;top:20px;bottom:-26px;width:2px;background:var(--line)}
.hour.past .t{opacity:.55}
.hour .cards{display:grid;gap:10px;min-width:0}
.now{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;margin-top:14px}
.now span{font-size:11px;font-weight:700;color:var(--bad);text-align:right;letter-spacing:.06em}
.now hr{border:0;height:2px;background:var(--bad);margin:0;position:relative}
.now hr::before{content:"";position:absolute;left:-6px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}

/* ---------- Carte ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:6px 1fr}
.card .stripe{background:var(--team)}
.card .in{padding:12px 14px 14px;display:grid;gap:12px;min-width:0}
.card.s-termine{background:var(--ok-bg);border-color:transparent}
.card.s-reporte .in{opacity:.7}
.card.alert{border:2px solid var(--bad)}
.h{display:flex;gap:10px;align-items:flex-start}
.h .ttl{flex:1;min-width:0}
.task{font-weight:700;font-size:16px;line-height:1.3}
.meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .ot{font-family:var(--mono);font-weight:500}
.meta .tm{font-weight:600;color:var(--ink)}
.who{font-size:12px;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-afaire{background:var(--idle-bg);color:var(--muted)}
.p-late{background:var(--warn-bg);color:var(--warn)}
.p-encours{background:var(--act);color:var(--act-ink)}
.p-termine{background:var(--ok);color:var(--surface)}
.p-reporte{background:var(--idle-bg);color:var(--muted)}

/* Suivi en 4 étapes */
.track{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.track::before{content:"";position:absolute;left:12.5%;right:12.5%;top:13px;height:3px;background:var(--line);border-radius:2px}
.track .fill{position:absolute;left:12.5%;top:13px;height:3px;background:var(--ok);border-radius:2px;transition:width .3s}
.st{display:grid;justify-items:center;gap:4px;position:relative;font-size:12px;color:var(--muted);text-align:center}
.st i{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;color:var(--muted)}
.st.done{color:var(--ok);font-weight:600}
.st.done i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.st.cur{color:var(--ink);font-weight:700}
.st.cur i{border-color:var(--act);color:var(--act);box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 18%,transparent)}
.card.s-termine .st i{background:var(--ok)}

.next{min-height:54px;border:0;border-radius:12px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;background:var(--act);color:var(--act-ink)}
.next.k-stop{background:var(--steel-dark);color:var(--surface)}
.next.k-finish{background:var(--slate);color:#fff}
.next.k-resume{background:var(--idle-bg);color:var(--ink)}
.next:active{transform:scale(.985)}
.done-msg{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--ok);min-height:40px}
.sub{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:-4px}
.flag{background:var(--bad);color:#fff;font-size:13px;font-weight:700;padding:8px 10px;border-radius:8px}
.note{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.foot{font-size:12px;color:var(--muted)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos.one{grid-template-columns:1fr}
.photos.odd a:first-child{grid-column:1/-1}
.photos a{display:block;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--raise);border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:contain;display:block}
.photos.one a,.photos.odd a:first-child{aspect-ratio:auto}
.photos.one img,.photos.odd a:first-child img{height:auto;max-height:70vh}
.photos .up{display:grid;place-items:center;aspect-ratio:4/3;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted);font-size:12px;text-align:center;padding:4px}
.addphoto{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1.5px dashed var(--act);border-radius:12px;background:none;color:var(--act);font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.addphoto:disabled{opacity:.5;cursor:wait}
.filein{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.band{margin-top:28px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:17px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.band::before,.band::after{content:"";flex:1;height:2px;background:var(--line)}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.donehead{margin-top:28px;width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:14px 16px;background:var(--ok-bg);color:var(--ok);font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-align:left}
.donehead .n{background:var(--ok);color:var(--surface);border-radius:999px;padding:2px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.donehead .chev{margin-left:auto;font-size:14px;transition:transform .2s}
.donehead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.donelist{display:grid;gap:10px;margin-top:10px}
.ring{cursor:pointer}
@media (prefers-reduced-motion:reduce){.donehead .chev{transition:none}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--slate);color:var(--slate-ink);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 12px;background:var(--safety);color:var(--safety-ink);cursor:pointer}
.demo{margin-top:10px;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--act);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.track .fill{transition:none}}
</style>
</head>

<div class="toast" id="toast" hidden><span id="toast-t"></span><button id="toast-undo">Annuler</button></div>

<script>
// Adresse du script Google (Apps Script) qui lit et écrit dans le Google Sheets
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxc2D4LiKKRjZh5vORQK3wUR4MMJ6kkVrFHGqG5dNmPMhDkVgNCVsRj0ER4Cx66I-0/exec";
const DEMO=false;
const DEMO_NOW=5*60+45; // 5h45 dans l'aperçu
const TEAMS=[
 {k:"A",short:"ARIFA · LABADI Nacer",who:"ARIFA Wael · LABADI Nacer",c:"#7FB2E5",zone:"ELY LOOS"},
 {k:"B",short:"DALAGI et équipe (7)",who:"DALAGI Béchir · BOUHAOUACHE Chokry · THABET Seghair · STAMBALI Neji · TRABELSI Ismael · FERJANI Aymen · ALLOUCHE Rajeb",c:"#EE9B5E",zone:"ELY LOOS"},
 {k:"C",short:"MIHOUB · HAJJI",who:"DHIA ARRAHMAN Mihoub · HAJJI Mounir",c:"#7CC48A",zone:"ELY LOOS"},
 {k:"D",short:"WATTEAU et équipe (Cafein)",who:"WATTEAU Matthieu · BOUVET Rodrigue · BEN HASSINE Mohamed Amine · LABADI Samir",c:"#C69BE0",zone:"Cafein"},
];
// [n° dans le tableau, repère affiché, équipe, intervention, OT, heure de début]
// La fermeture TH MS3801 porte le n° 17 dans le tableau (repère 1 sur le papier) pour que chaque ligne ait son propre numéro.
const JOBS=[
 ["1","1","A","Ouverture TH MS3801","4027436",7],
 ["17","1","A","Fermeture TH MS3801","4027436",12],
 ["2","2","B","Dépose contrôle de la crosse AS4201","4022340",6],
 ["3","3","B","Repose contrôle de la crosse AS4201","4022340",16],
 ["4","4","B","Remplacement tuyauterie crosse AS4201","4022838",13],
 ["5","5","B","Travaux colonne AS4201","4022341",6],
 ["6","6","B","Pose bride pleine DN25 mano","4026250",11],
 ["7","7","B","Contrôle des injecteurs AS4201","4027088",9],
 ["8","8","C","Remplacement RO42064","4010294",13],
 ["9","9","C","Remplacement vanne B25114 + joints","4022831",13],
 ["10","10","C","Remplacement joint PIT16008","4027397",8],
 ["11","11","C","Remplacement vanne SC16019","4022924",10],
 ["12","12","C","Remplacement bride pleine DN80","4027948",9],
 ["13","13","C","Remplacement joint RO16002","4028060",8],
 ["14","14","A","Remplacement joint tuyauterie CL + RO15094","4021673",13],
 ["15","15","A","Remplacement joints tuyauterie saumure chlore","4021674",13],
 ["16","16","D","Remplacement anneaux colonne AS5501","4028457",6],
];
const TEAM=Object.fromEntries(TEAMS.map(t=>[t.k,t]));
const LBL={afaire:"À faire",encours:"En cours",termine:"Terminé",reporte:"Reporté"};

let state={}, me={name:"",team:""}, view="mine", kfilter=null, lastUndo=null, notesOpen={}, pending=0;
const CODE=Object.fromEntries(Object.entries({afaire:"À faire",encours:"En cours",termine:"Terminé",reporte:"Reporté"}).map(([a,b])=>[b,a]));
try{if(!DEMO)me=JSON.parse(localStorage.getItem("ely-me")||"null")||me;}catch(e){}
const nowMin=()=>DEMO?DEMO_NOW:(new Date().getHours()*60+new Date().getMinutes());
const st=k=>Object.assign({permis:false,stop5:false,etat:"afaire",note:"",by:"",at:"",photos:[]},state[k]||{});
let uploading={};
const isAlert=s=>(s.etat==="encours"||s.etat==="termine")&&(!s.permis||!s.stop5);
const isLate=(s,h)=>s.etat==="afaire"&&nowMin()>=h*60+15;
function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v===false||v==null)continue;if(x==="class")e.className=v;else if(x==="style")e.style.cssText=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v===true?"":v);}k.flat().forEach(c=>c!=null&&c!==false&&e.append(c));return e;}
const hhmm=iso=>{try{return new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}catch(e){return "";}};

/* ---------- Qui es-tu ---------- */
const nameIn=document.getElementById("me-name");
function renderMe(){
  const has=me.name&&me.team;
  document.getElementById("onboard").hidden=!!has;
  document.getElementById("hello").hidden=!has;
  document.getElementById("v-mine").disabled=!has;if(!has)view="all";
  if(!has){
    nameIn.value=me.name||"";
    document.getElementById("teams").replaceChildren(...TEAMS.map(t=>el("button",{class:"tbtn","aria-pressed":String(me.team===t.k),onclick:()=>{me.team=t.k;renderMe();render();}},
      el("span",{class:"sw",style:"background:"+t.c}),el("span",{},el("b",{},t.short),el("span",{class:"nm"},t.who),el("small",{},t.zone+" · "+JOBS.filter(j=>j[2]===t.k).length+(JOBS.filter(j=>j[2]===t.k).length>1?" interventions":" intervention"))))));
    return;
  }
  const t=TEAM[me.team];
  document.getElementById("hello-sw").style.background=t.c;
  document.getElementById("hello-name").textContent="Bonjour "+me.name.split(" ")[0];
  const meLow=me.name.toLowerCase();
  document.getElementById("hello-team").replaceChildren(...t.who.split(" · ").map(m=>{
    const mine=m.toLowerCase().split(/\s+/).some(w=>w.length>2&&meLow.includes(w));
    return el("span",{class:mine?"me-chip":null},m);}));
}
nameIn.addEventListener("input",()=>{me.name=nameIn.value.trim();});
document.getElementById("me-ok").onclick=()=>{
  if(!me.name){nameIn.focus();toast("Indique ton nom");return;}
  if(!me.team){toast("Choisis ton équipe");return;}
  try{if(!DEMO)localStorage.setItem("ely-me",JSON.stringify(me));}catch(e){}
  view="mine";renderMe();render();
};
document.getElementById("me-edit").onclick=()=>{me.team="";renderMe();render();};
document.getElementById("v-mine").onclick=()=>{if(!me.team)return;view="mine";kfilter=null;render();window.scrollTo({top:document.querySelector(".segbar").offsetTop-4,behavior:"smooth"});};
document.getElementById("v-all").onclick=()=>{view="all";kfilter=null;render();window.scrollTo({top:document.querySelector(".segbar").offsetTop-4,behavior:"smooth"});};

/* ---------- Recherche ---------- */
let query="", showDone=false;
try{showDone=localStorage.getItem("ely-showdone")==="1";}catch(e){}
const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"").trim();
function matchJob(j,qn){
  const [k,rep,tk,task,ot]=j;
  if(norm(ot).includes(qn)||norm(task).includes(qn))return true;
  const r=qn.replace(/^(repere|rep|n°|no)/,"");
  return r!==""&&/^\d+$/.test(r)&&r.length<=2&&rep===r;
}
function hl(text){
  const qn=norm(query);if(!qn)return text;
  // repère le passage cherché dans le texte d'origine (espaces et accents ignorés)
  const chars=[...text],map=[];let flat="";
  chars.forEach((c,i)=>{const n=norm(c);for(const _ of n){flat+=_;map.push(i);}});
  const at=flat.indexOf(qn);if(at<0)return text;
  const a=map[at],b=map[at+qn.length-1]+1;
  return [chars.slice(0,a).join(""),el("mark",{},chars.slice(a,b).join("")),chars.slice(b).join("")];
}
const qIn=document.getElementById("q"),qClr=document.getElementById("q-clr");
qIn.addEventListener("input",()=>{query=qIn.value;qClr.hidden=!query;kfilter=null;render();});
qClr.addEventListener("click",()=>{query="";qIn.value="";qClr.hidden=true;render();qIn.focus();});

/* ---------- Rendu ---------- */
function render(){
  document.getElementById("v-mine").setAttribute("aria-pressed",String(view==="mine"));
  document.getElementById("v-all").setAttribute("aria-pressed",String(view==="all"));
  document.getElementById("c-all").textContent=JOBS.length+" interventions";
  document.getElementById("c-mine").textContent=me.team?JOBS.filter(j=>j[2]===me.team).length+" interventions":"choisis ton équipe";
  const qn=norm(query);
  const scope=JOBS.filter(j=>qn?matchJob(j,qn):(view==="all"||!me.team||j[2]===me.team));
  const qi=document.getElementById("qinfo");qi.hidden=!qn;
  if(qn)qi.replaceChildren(el("b",{},String(scope.length)),scope.length>1?" interventions trouvées dans tout le planning":" intervention trouvée dans tout le planning");
  const done=scope.filter(j=>st(j[0]).etat==="termine").length;
  const enc=scope.filter(j=>st(j[0]).etat==="encours").length;
  const late=scope.filter(j=>isLate(st(j[0]),j[5])).length;
  const al=scope.filter(j=>isAlert(st(j[0]))).length;
  document.getElementById("ringn").textContent=`${done}/${scope.length}`;
  document.getElementById("ringc").setAttribute("stroke-dashoffset",String(226.2*(1-(scope.length?done/scope.length:0))));
  const K=[["encours","En cours",enc,false],["late","En retard",late,late>0],["reste","À faire",scope.length-done-scope.filter(j=>st(j[0]).etat==="reporte").length,false]];
  if(al)K.splice(1,1,["alert","Sans permis/Stop 5",al,true]);
  K.push(["done","Terminées",done,false]);
  document.getElementById("kpis").replaceChildren(...K.map(([k,l,n,hot])=>el("button",{class:"kpi"+(hot?" hot":"")+(k==="done"?" done":""),"aria-pressed":String(kfilter===k),onclick:()=>{kfilter=kfilter===k?null:k;render();}},el("b",{},String(n)),el("span",{},l))));

  const pass=j=>{const s=st(j[0]);if(!kfilter)return true;
    if(kfilter==="encours")return s.etat==="encours";
    if(kfilter==="late")return isLate(s,j[5]);
    if(kfilter==="alert")return isAlert(s);
    if(kfilter==="reste")return s.etat==="afaire"||s.etat==="encours";
    if(kfilter==="done")return s.etat==="termine";return true;};
  const list=scope.filter(pass);
  const main=list.filter(j=>st(j[0]).etat!=="termine");
  const doneList=list.filter(j=>st(j[0]).etat==="termine").sort((a,b)=>a[5]-b[5]);
  const out=[];
  if(kfilter)out.push(el("div",{class:"sync"},"Filtre actif · ",el("button",{class:"link",onclick:()=>{kfilter=null;render();}},"Tout afficher")));
  const wide=view==="all"||!!qn;
  const zones=wide?["ELY LOOS","Cafein"]:[TEAM[me.team]?.zone||"ELY LOOS"];
  zones.forEach(z=>{
    const zl=main.filter(j=>TEAM[j[2]].zone===z);
    if(!zl.length)return;
    if(wide)out.push(el("div",{class:"band"},z==="Cafein"?"Cafein":"ELY LOOS"));
    const hours=[...new Set(zl.map(j=>j[5]))].sort((a,b)=>a-b);
    let nowPlaced=false;
    hours.forEach(h=>{
      if(!nowPlaced&&nowMin()<h*60){out.push(nowLine());nowPlaced=true;}
      const jobs=zl.filter(j=>j[5]===h);
      out.push(el("section",{class:"hour"+(nowMin()>=(h+1)*60?" past":"")},el("div",{class:"t"},h+"h"),el("div",{class:"cards"},jobs.map(card))));
    });
    if(!nowPlaced)out.push(nowLine());
  });
  if(!main.length&&doneList.length&&!qn&&kfilter!=="done")out.push(el("div",{class:"empty"},"✓ Tout est terminé pour cette vue."));
  else if(!list.length)out.push(el("div",{class:"empty"},kfilter==="done"?"Aucune intervention terminée pour l'instant.":qn?`Aucune intervention pour « ${query.trim()} ». Vérifie le numéro d'OT.`:kfilter?"Rien dans ce filtre.":"Aucune intervention."));
  if(doneList.length){
    const open=showDone||!!qn||kfilter==="done";
    out.push(el("button",{class:"donehead",id:"donehead","aria-expanded":String(open),onclick:()=>{showDone=!open;try{localStorage.setItem("ely-showdone",showDone?"1":"0");}catch(e){}render();if(showDone)document.getElementById("donehead")?.scrollIntoView({behavior:"smooth",block:"start"});}},
      "✓ Terminées",el("span",{class:"n"},String(doneList.length)),el("span",{class:"chev","aria-hidden":"true"},"▼")));
    if(open)out.push(el("div",{class:"donelist"},doneList.map(card)));
  }
  document.getElementById("list").replaceChildren(...out);
}
function nowLine(){const m=nowMin();return el("div",{class:"now"},el("span",{},`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`),el("hr"));}

function nextStep(s){
  if(s.etat==="termine")return null;
  if(s.etat==="reporte")return {k:"resume",label:"Reprendre l'intervention",patch:{etat:"afaire"},msg:"Intervention reprise"};
  if(!s.permis)return {k:"permis",label:"① J'ai fait le permis",patch:{permis:true},msg:"Permis validé"};
  if(!s.stop5)return {k:"stop",label:"② J'ai fait le Stop 5",patch:{stop5:true},msg:"Stop 5 validé"};
  if(s.etat==="afaire")return {k:"start",label:"▶ Démarrer les travaux",patch:{etat:"encours"},msg:"Travaux démarrés"};
  return {k:"finish",label:"✓ Travaux terminés",patch:{etat:"termine"},msg:"Terminée : rangée en bas dans « Terminées »"};
}
function stepIndex(s){if(s.etat==="termine")return 4;if(s.etat==="encours")return 3;if(s.stop5&&s.permis)return 2;if(s.permis)return 1;return 0;}

function card(j){
  const [k,rep,tk,task,ot,h]=j, s=st(k), t=TEAM[tk], late=isLate(s,h), alert=isAlert(s);
  const idx=stepIndex(s);
  const pill=late?["p-late","En retard"]:["p-"+s.etat,LBL[s.etat]];
  const steps=[["Permis",s.permis],["Stop 5",s.stop5],["Démarré",s.etat==="encours"||s.etat==="termine"],["Terminé",s.etat==="termine"]];
  const track=el("div",{class:"track","aria-label":"Avancement de l'intervention"},
    el("span",{class:"fill",style:`width:${Math.min(idx,3)/3*75}%`}),
    steps.map(([l,ok],i)=>el("div",{class:"st"+(ok?" done":"")+(i===idx&&s.etat!=="reporte"?" cur":"")},el("i",{},ok?"✓":String(i+1)),l)));
  const n=nextStep(s);
  const action=n?el("button",{class:"next k-"+n.k,id:"next-"+k,onclick:()=>apply(k,n.patch,n.msg)},n.label)
                :el("div",{class:"done-msg"},"✓ Intervention terminée");
  const subs=[];
  if(s.etat!=="reporte"&&s.etat!=="termine")subs.push(el("button",{class:"link",onclick:()=>apply(k,{etat:"reporte"},"Intervention reportée")},"Reporter"));
  if(idx>0&&s.etat!=="reporte")subs.push(el("button",{class:"link",onclick:()=>apply(k,back(s),"Étape annulée")},"Revenir en arrière"));
  if(!s.note&&!notesOpen[k])subs.push(el("button",{class:"link",onclick:()=>{notesOpen[k]=true;render();document.getElementById("note-"+k)?.focus();}},"+ Remarque"));
  let note=null;
  if(s.note||notesOpen[k]){note=el("input",{class:"note",id:"note-"+k,placeholder:"Remarque (ex. pièce manquante)",value:s.note||""});note.addEventListener("change",()=>apply(k,{note:note.value.trim()},"Remarque enregistrée"));}
  return el("article",{class:`card s-${s.etat}${alert?" alert":""}`,style:"--team:"+t.c},
    el("span",{class:"stripe"}),
    el("div",{class:"in"},
      el("div",{class:"h"},
        el("div",{class:"ttl"},el("div",{class:"task"},hl(task)),
          el("div",{class:"meta"},el("span",{class:"tm"},"Début "+h+"h"),el("span",{class:"ot"},"OT ",hl(ot)),el("span",{},"Repère "+rep)),
          (view==="all"||norm(query))?el("div",{class:"who"},"👷 "+t.who):null),
        el("span",{class:"pill "+pill[0]},pill[1])),
      alert?el("div",{class:"flag"},"⚠ Travaux démarrés sans permis ou sans Stop 5"):null,
      track, action, subs.length?el("div",{class:"sub"},subs):null, note, photoBlock(k,s),
      (s.by||s.at)?el("div",{class:"foot"},(s.by?`Dernière action : ${s.by}`:"Modifié")+(s.at?` à ${hhmm(s.at)}`:"")):null));
}
function photoBlock(k,s){
  const thumbs=(s.photos||[]).map(id=>el("a",{href:"https://drive.google.com/file/d/"+encodeURIComponent(id)+"/view",target:"_blank",rel:"noopener","aria-label":"Voir la photo"},
    el("img",{src:"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1200",alt:"Photo de l'intervention",loading:"lazy"})));
  if(uploading[k])thumbs.push(el("div",{class:"up"},"Envoi…"));
  const inp=el("input",{type:"file",accept:"image/*",class:"filein",id:"file-"+k,multiple:true});
  inp.addEventListener("change",()=>{const f=[...inp.files];inp.value="";if(f.length)uploadPhotos(k,f);});
  const btn=el("button",{class:"addphoto",id:"addphoto-"+k,disabled:!!uploading[k],onclick:()=>{if(needName())return;inp.click();}},
    "📷 "+((s.photos||[]).length?"Ajouter une autre photo":"Ajouter une photo"));
  return el("div",{style:"display:grid;gap:8px"},thumbs.length?el("div",{class:"photos"+(thumbs.length===1?" one":thumbs.length%2?" odd":"")},thumbs):null,btn,inp);
}
function needName(){if(me.name)return false;toast("Indique d'abord ton nom en haut de la page");window.scrollTo({top:0,behavior:"smooth"});return true;}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.82).split(",")[1]);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("image illisible"));};
    img.src=url;});
}
async function uploadPhotos(k,files){
  if(DEMO){toast("Aperçu : la photo n'est pas envoyée");return;}
  uploading[k]=true;pending++;render();
  let ok=0;
  for(const f of files){
    try{
      const data=await shrink(f);
      const j=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action:"photo",n:Number(k),type:"image/jpeg",data,by:me.name})}).then(r=>r.json());
      if(!j.ok)throw new Error(j.error||"refus");
      const s=st(k);state[k]=Object.assign(s,{photos:[...(s.photos||[]),j.id]});ok++;
    }catch(e){toast("Photo non envoyée : vérifie le réseau puis réessaie");}
  }
  uploading[k]=false;pending--;render();
  if(ok)toast(ok>1?ok+" photos ajoutées":"Photo ajoutée");
}
function back(s){if(s.etat==="termine")return {etat:"encours"};if(s.etat==="encours")return {etat:"afaire"};if(s.stop5)return {stop5:false};return {permis:false};}

function apply(k,patch,msg){
  if(!me.name){toast("Indique d'abord ton nom");return;}
  const prev=state[k]?{...state[k]}:undefined;
  state[k]=Object.assign(st(k),patch,{by:me.name,at:DEMO?`2026-11-03T05:45:00+01:00`:new Date().toISOString()});
  lastUndo=()=>{if(prev)state[k]=prev;else delete state[k];render();send(k);};
  render();toast(msg,true);send(k);
}
function send(k){
  if(DEMO)return;
  const s=st(k);pending++;
  fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({n:Number(k),permis:!!s.permis,stop5:!!s.stop5,etat:LBL[s.etat],note:s.note||"",by:s.by||me.name})})
   .then(r=>r.json()).then(j=>{if(!j.ok)throw 0;})
   .catch(()=>toast("Pas enregistré : vérifie le réseau puis recommence"))
   .finally(()=>pending--);
}
async function load(){
  if(DEMO||pending>0)return;
  try{
    const j=await fetch(SCRIPT_URL+"?t="+Date.now()).then(r=>r.json());
    if(pending>0)return;
    const s={};(j.rows||[]).forEach(x=>{s[String(x.n)]={permis:!!x.permis,stop5:!!x.stop5,etat:CODE[x.etat]||"afaire",note:x.note||"",by:x.by||"",at:x.at||"",photos:Array.isArray(x.photos)?x.photos:[]};});
    state=s;render();
    document.getElementById("sync").innerHTML='<i></i>À jour à '+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+' · se met à jour tout seul';
  }catch(e){document.getElementById("sync").textContent="Connexion au tableau impossible, nouvel essai dans quelques secondes.";}
}
let tt;
function toast(msg,undo){
  const T=document.getElementById("toast");document.getElementById("toast-t").textContent=msg;
  document.getElementById("toast-undo").hidden=!undo;T.hidden=false;clearTimeout(tt);tt=setTimeout(()=>T.hidden=true,4000);
}
document.getElementById("toast-undo").onclick=()=>{lastUndo&&lastUndo();lastUndo=null;document.getElementById("toast").hidden=true;};

document.querySelector(".ring").addEventListener("click",()=>{const d=document.getElementById("donehead");if(!d)return;if(d.getAttribute("aria-expanded")!=="true")d.click();else d.scrollIntoView({behavior:"smooth",block:"start"});});
renderMe();render();
if(DEMO)document.getElementById("sync").hidden=true;
else{document.getElementById("demo").hidden=true;load();setInterval(load,15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});}
</script>
</body>
